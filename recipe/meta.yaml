{% set name = "virtualenv" %}
{% set version = "21.14.13" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: de5307ba4b9a0001d9c8ea02832d38f63ca432880f416c1bface61c4323fd905

build:
  number: 0
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - virtualenv = virtualenv.__main__:run_with_catch

requirements:
  host:
    - python
    - pip
    - hatch-vcs >=0.5
    # Anaconda won't build and release for py<3.10
    - hatchling >=1.28  # [py>=310]
  run:
    - python
    - distlib >=0.4.3,<1
    # Anaconda won't build and release for py<3.10
    - filelock >=3.24.2,<5  # [py>=310]
    - packaging >=26.3
    - platformdirs >=4.4,<5
    - python-discovery >=1.6.1
    - typing-extensions >=4.16  # [py<311]

{% set ignored_tests_win = [
  "--deselect=tests/unit/create/test_creator.py::test_create_clear_resets[clear-cpython3-win]",
  "--deselect=tests/unit/create/test_creator.py::test_getsitepackages_system_site",
  "--deselect=tests/unit/create/test_creator.py::test_create_clear_resets[no_clear-cpython3-win]",
  "--deselect=tests/unit/activation/test_python_activator.py::test_python[no_prompt]"
] %}

{% set ignored_tests = [
  "--ignore=tests/unit/seed/wheels/test_periodic_update.py",
  "--deselect=tests/unit/seed/wheels/test_acquire.py::test_get_wheel_download_cached",
  "--deselect=tests/unit/seed/wheels/test_bundle.py::test_notices_mention_every_bundled_distribution",
  "--deselect=tests/unit/create/test_creator.py::test_venv_fails_not_inline "
] %}

# New tests that fail on osx. Seems to be related to system reporting support for gbk locale, but
# system csh not supporting it.
{% set ignored_tests_osx = [
  "--deselect=tests/unit/activation/test_csh.py::test_cshell_renders_prompt_literally[gbk-caret]",
  "--deselect=tests/unit/activation/test_csh.py::test_cshell_renders_prompt_literally[gbk-history]",
  "--deselect=tests/unit/activation/test_csh.py::test_cshell_renders_prompt_literally[gbk-backslash-caret]",
  "--deselect=tests/unit/activation/test_csh.py::test_cshell_renders_prompt_literally[gbk-backslash-history]"
] %}

test:
  requires:
    - pip
    - flaky >=3.7
    - packaging >=23.1
    - pytest >=7.4
    - pytest-mock >=3.11.1
    - pytest-randomly >=3.12
    - pytest-timeout >=2.1
  source_files:
    - tests
    - pyproject.toml
  imports:
    - virtualenv
    - virtualenv.activation
    - virtualenv.activation.bash
    - virtualenv.activation.batch
    - virtualenv.activation.cshell
    - virtualenv.activation.fish
    - virtualenv.activation.nushell
    - virtualenv.activation.powershell
    - virtualenv.activation.python
    - virtualenv.activation.xonsh
    - virtualenv.app_data
    - virtualenv.config
    - virtualenv.config.cli
    - virtualenv.create
    - virtualenv.discovery
    - virtualenv.run
    - virtualenv.run.plugin
    - virtualenv.seed
    - virtualenv.seed.embed
    - virtualenv.seed.wheels
    - virtualenv.util
    - virtualenv.util.path
    - virtualenv.util.subprocess
  commands:
    - pip check
    # Missing pytest-env
    - set PATH=%PREFIX%\Library\bin;%PATH%  # [win]
    - pytest -vvv {{ ignored_tests | join(' ') }} {{ ignored_tests_win | join(' ') }}  # [win]
    - pytest -vvv {{ ignored_tests | join(' ') }} {{ ignored_tests_osx | join(' ') }}  # [osx]
    - pytest -vvv {{ ignored_tests | join(' ') }}  # [linux]
    - virtualenv --help

about:
  home: https://virtualenv.pypa.io/
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Virtual Python Environment builder
  description: |
    A tool for creating isolated virtual python environments.
  doc_url: https://virtualenv.pypa.io
  dev_url: https://github.com/pypa/virtualenv

extra:
  recipe-maintainers:
    - mingwandroid
    - kalefranz
